appId: com.waterviewbakehouse.breadlab
---
- runFlow: ../subflows/open_app.yaml

- tapOn:
    id: "recipe-builder-tab-toggle"

# Pre-test cleanup: If "Sample Loaf" already exists from a previous run, delete it first
- runFlow:
    when:
      visible: "Sample Loaf"
    commands:
      - tapOn: "Sample Loaf"
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element: "Delete Recipe"
          direction: DOWN
      - tapOn: "Delete Recipe"
      - tapOn: "Delete"
      - waitForAnimationToEnd

# Main diagnostic workflow
- tapOn:
    id: "new-recipe-button"

- waitForAnimationToEnd

- tapOn:
    id: "recipe-name-input"

- inputText: "Sample Loaf"

- tapOn:
    id: "yield-input"

- inputText: "2"

- tapOn:
    id: "save-recipe-button"

- assertVisible:
    text: "Sample Loaf"

- takeScreenshot: "recipe_list_after_creation"

- tapOn:
    text: "Sample Loaf"

- waitForAnimationToEnd

- takeScreenshot: "after_sample_loaf_tap"
