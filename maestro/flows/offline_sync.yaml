appId: com.waterviewbakehouse.breadlab
---
- runFlow: ../subflows/open_app.yaml
- tapOn: "Bench"
- tapOn: "Recipe Runner"
- tapOn: "Select Recipe"
- tapOn: "Test Sourdough"
- runScript:
    file: "../scripts/network_toggle.js"
    env:
      ENABLED: "false"
- tapOn: "Start Phase"
- runScript:
    file: "../scripts/network_toggle.js"
    env:
      ENABLED: "true"
- tapOn: "Complete Phase"
- assertVisible: "Bake complete"
