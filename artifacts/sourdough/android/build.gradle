// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
  // Force all libraries to use the E:/bl short-path junction for dependencies
  // to avoid C++ path limit overflows (260 characters) on Windows.
  if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
    ext.REACT_NATIVE_NODE_MODULES_DIR = "E:/bl/node_modules/react-native"
    ext.REACT_NATIVE_DIR = "E:/bl/node_modules/react-native"
    ext.REACT_NATIVE_WORKLETS_NODE_MODULES_DIR = "E:/bl/node_modules/react-native-worklets"
  }
}

def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()

subprojects {
  // Redirect all build outputs to a short path on Windows to bypass 260-char limit.
  afterEvaluate {
    def isAndroidModule = plugins.hasPlugin('com.android.library') || plugins.hasPlugin('com.android.application')
    if (isAndroidModule && isWindows) {
      // 1. Redirect CMake staging (.cxx)
      try {
        android.externalNativeBuild.cmake.buildStagingDirectory = new File("E:/x/${project.name}")
      } catch (Exception e) {}

      // 2. Junction 'generated' and 'intermediates' to short paths
      def junctionFolders = [
        "generated": "E:/g/${project.name}",
        "intermediates/cmake": "E:/b/${project.name}/cmake",
        "intermediates/cxx": "E:/b/${project.name}/cxx"
      ]

      junctionFolders.each { relPath, shortPath ->
        def target = new File(project.projectDir, "build/${relPath}")
        def source = new File(shortPath)
        if (!source.exists()) source.mkdirs()
        
        target.parentFile.mkdirs()
        
        def isJunction = false
        if (target.exists()) {
          def procCheck = new ProcessBuilder("cmd", "/c", "dir", target.parentFile.absolutePath).start()
          def outCheck = procCheck.inputStream.text
          isJunction = outCheck.contains("<JUNCTION>") && outCheck.contains(target.name)
          
          // CRITICAL: If it's a junction but points to the wrong drive (e.g. legacy C:), 
          // we must treat it as NOT a valid junction and force recreation.
          if (isJunction && !outCheck.contains(source.absolutePath.replace('/', '\\'))) {
            isJunction = false
          }
        }

        if (!isJunction) {
          if (target.exists()) new ProcessBuilder("cmd", "/c", "rd", "/S", "/Q", target.absolutePath).start().waitFor()
          new ProcessBuilder("cmd", "/c", "mklink", "/J", target.absolutePath, source.absolutePath).start().waitFor()
        }
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

gradle.projectsEvaluated {
  println "[build.gradle] Evaluating projectsEvaluated block..."

  def appProject = rootProject.findProject(':app')
  if (appProject != null) {
    def patchTask = appProject.tasks.register('patchAutolinkingCmake') {
      outputs.upToDateWhen { false }

      doLast {
        if (!isWindows) {
          println "[build.gradle] Skipping patchAutolinkingCmake on non-Windows platform."
          return
        }
        println "[build.gradle] Running patchAutolinkingCmake..."
          // --- The Junction Root Strategy ---
          // Using junction 'E:/bl' -> 'E:/Bread-Lab'
          def shortRoot = "E:/bl"
          
          def cmakeFile = isWindows ?
            new File("E:\\b\\app\\generated\\autolinking\\src\\main\\jni\\Android-autolinking.cmake") :
            new File(appProject.buildDir, "generated/autolinking/src/main/jni/Android-autolinking.cmake")

        if (cmakeFile.exists()) {
          def original = cmakeFile.text
          def patched = original
          
          def realRoot = new File(rootProject.projectDir.parentFile.parentFile.parentFile, "").absolutePath.replace('\\', '/')

          // Replace ALL absolute project paths with E:/bl versions
          patched = patched.replace(realRoot, shortRoot)
          patched = patched.replace("E:/Bread-Lab", shortRoot)
          patched = patched.replace("E:/BREAD-~1", shortRoot)
          
          if (patched != original) {
            cmakeFile.text = patched
            println "[build.gradle] Patched Android-autolinking.cmake: used C:/bl junction paths."
          }
        }
      }
    }

    appProject.tasks.configureEach { t ->
      if (t.name.contains('CMake') || t.name.contains('externalNativeBuild')) {
        t.dependsOn(patchTask)
      }
      if (t.name == 'generateAutolinkingNewArchitectureFiles') {
        t.finalizedBy(patchTask)
      }
    }
  }
}
